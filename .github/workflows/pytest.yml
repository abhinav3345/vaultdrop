name: Pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultdrop_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d vaultdrop_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install uv
          uv sync --locked --dev
      - name: Run pytest
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          export TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:${POSTGRES_PORT}/vaultdrop_test"
          uv run --locked pytest -v --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
