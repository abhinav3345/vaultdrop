---
services:
  app:
    build: .
    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vaultdrop
      DROP_KEY: "${DROP_KEY:-}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultdrop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaultdrop"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-db:
    image: docker.io/library/postgres:16
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultdrop_test
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d vaultdrop_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
